apiVersion: apps/v1
kind: Deployment
metadata:
  name: timetable-app
  namespace: qa
spec:
  replicas: 2
  selector:
    matchLabels:
      app: timetable-app
  template:
    metadata:
      labels:
        app: timetable-app
    spec:
      imagePullSecrets:
        - name: dockerhub-pull-secret
      containers:
        - name: timetable-app
          image: harshithar1122/timetable-clash-python:qa
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              value: "postgresql://timetable_user:local_dev_password@postgres:5432/timetable"
            - name: REDIS_URL
              value: "redis://redis:6379/0"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: timetable-app
  namespace: qa
spec:
  type: ClusterIP
  selector:
    app: timetable-app
  ports:
    - port: 8080
      targetPort: 8080
