services:
  db:
    image: postgres:16.4
    environment:
      POSTGRES_DB: timetable
      POSTGRES_USER: timetable_user
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timetable_user -d timetable"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: postgres:16.4
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: local_dev_password
    volumes:
      - ./migrations:/migrations:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        psql -h db -U timetable_user -d timetable -v ON_ERROR_STOP=1 -f /migrations/001_schema.sql &&
        psql -h db -U timetable_user -d timetable -v ON_ERROR_STOP=1 -f /migrations/002_seed.sql
    restart: "no"

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://timetable_user:local_dev_password@db:5432/timetable
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
