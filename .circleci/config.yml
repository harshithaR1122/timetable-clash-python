version: 2.1

jobs:
  lint:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install development dependencies
          command: pip install -r requirements-dev.txt
      - run:
          name: Run Ruff
          command: python -m ruff check app tests

  unit-tests:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install development dependencies
          command: pip install -r requirements-dev.txt
      - run:
          name: Run unit tests
          command: python -m pytest tests/test_clashes.py --cov=app.clashes --cov-report=term-missing --cov-fail-under=70

  integration-tests:
    docker:
      - image: cimg/python:3.12
      - image: postgres:16.4
        environment:
          POSTGRES_DB: timetable
          POSTGRES_USER: timetable_user
          POSTGRES_PASSWORD: local_dev_password
      - image: redis:7.4
    environment:
      DATABASE_URL: postgresql://timetable_user:local_dev_password@localhost:5432/timetable
      REDIS_URL: redis://localhost:6379/0
    steps:
      - checkout
      - run:
          name: Install development dependencies
          command: pip install -r requirements-dev.txt
      - run:
          name: Wait for services and apply migrations
          command: |
            python -c "import time; from pathlib import Path; import psycopg; import redis; db='postgresql://timetable_user:local_dev_password@localhost:5432/timetable'; cache='redis://localhost:6379/0'; ready=False; exec('for attempt in range(30):\n try:\n  with psycopg.connect(db, connect_timeout=2): pass\n  redis.Redis.from_url(cache, socket_connect_timeout=2).ping()\n  ready=True\n  break\n except Exception:\n  if attempt == 29: raise\n  time.sleep(2)'); exec('with psycopg.connect(db) as conn:\n for filename in (\"migrations/001_schema.sql\", \"migrations/002_seed.sql\"):\n  conn.execute(Path(filename).read_text(encoding=\"utf-8\"))\n conn.commit()'); print('Services ready; migrations applied.')"
      - run:
          name: Run integration tests
          command: python -m pytest tests/test_integration.py -v

  secret-scan:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - run:
          name: Install Gitleaks
          command: |
            VERSION=8.24.2
            curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
            tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
            sudo install /tmp/gitleaks /usr/local/bin/gitleaks
      - run:
          name: Scan repository files for secrets
          command: gitleaks dir . --redact --exit-code 1

  docker-build-and-push:
    parameters:
      image_tag:
        type: string
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Build and push Docker images
          command: |
            set -eu

            if [ -z "${DOCKERHUB_USER:-}" ] || [ -z "${DOCKERHUB_TOKEN:-}" ]; then
              echo "Docker Hub credentials are missing from CircleCI project environment variables."
              exit 1
            fi

            IMAGE="${DOCKERHUB_USER}/timetable-clash-python"
            SHORT_SHA="$(printf '%s' "$CIRCLE_SHA1" | cut -c1-7)"

            echo "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USER" --password-stdin

            docker build \
              --tag "${IMAGE}:<< parameters.image_tag >>" \
              --tag "${IMAGE}:${CIRCLE_BRANCH}-${SHORT_SHA}" \
              .

            docker push "${IMAGE}:<< parameters.image_tag >>"
            docker push "${IMAGE}:${CIRCLE_BRANCH}-${SHORT_SHA}"

            docker logout

workflows:
  main-full-ci:
    jobs:
      - lint:
          filters:
            branches:
              only: main

      - unit-tests:
          requires:
            - lint
          filters:
            branches:
              only: main

      - integration-tests:
          requires:
            - unit-tests
          filters:
            branches:
              only: main

      - secret-scan:
          requires:
            - integration-tests
          filters:
            branches:
              only: main

      - docker-build-and-push:
          name: publish-qa-image
          image_tag: qa
          requires:
            - secret-scan
          filters:
            branches:
              only: main

  staging-build:
    jobs:
      - docker-build-and-push:
          name: publish-stage-image
          image_tag: stage
          filters:
            branches:
              only: staging

  prod-build:
    jobs:
      - docker-build-and-push:
          name: publish-prod-image
          image_tag: prod
          filters:
            branches:
              only: prod
